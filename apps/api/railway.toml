# Railway service config. Set the service's root directory to /apps/api.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Migrations run before the new version takes traffic. The image has no
# shell: goose reads GOOSE_DBSTRING (set it to the database URL).
preDeployCommand = ["/app/goose up"]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
